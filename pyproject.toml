[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-agent-sdk-learning"
version = "1.0.0"
description = "75 Python Claude Agent SDK lessons with FastAPI and NiceGUI"
requires-python = ">=3.12"
dependencies = [
  "claude-agent-sdk==0.2.163",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "nicegui>=3,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3",
  "mcp>=1.20,<2",
  "httpx>=0.28,<1",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "python-docx>=1.1,<2",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
browser = ["playwright>=1.50"]
desktop = ["pywebview>=6"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11",
    "mypy>=1.15",
    "uv>=0.8",
    "playwright>=1.50",
    "httpx2>=2.13.1",
]

[project.scripts]
agent-lab = "agent_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--basetemp=.lab-data/pytest"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true

