<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="590" viewBox="0 0 1080 590" role="img" aria-labelledby="title desc">
<title id="title">Lesson 48 lab walkthrough</title><desc id="desc">Contrast and guarded lanes use the same fixed probes and compare tool decisions with real effects.</desc>
<rect width="1080" height="590" fill="#f8fafc"/><text x="48" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">One action, two fresh lanes</text>
<g font-family="Arial,sans-serif"><rect x="48" y="104" width="470" height="340" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="80" y="151" font-size="24" font-weight="700" fill="#9a3412">Contrast lane</text><text x="80" y="194" font-size="18" fill="#0f172a">Same fixed Read, Write and Bash probes</text><text x="80" y="234" font-size="18" fill="#0f172a">Synthetic application value is present</text><text x="80" y="274" font-size="18" fill="#0f172a">Permitted owned effects are observed</text><text x="80" y="314" font-size="18" fill="#0f172a">Collector baseline proves endpoint works</text><text x="80" y="373" font-size="16" fill="#7c2d12">Source: authored host or native SDK</text>
<rect x="562" y="104" width="470" height="340" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="594" y="151" font-size="24" font-weight="700" fill="#065f46">Guarded lane</text><text x="594" y="194" font-size="18" fill="#0f172a">Fresh synthetic fixtures and fake key</text><text x="594" y="234" font-size="18" fill="#0f172a">PreToolUse denies protected effects</text><text x="594" y="274" font-size="18" fill="#0f172a">PostToolUse rewrites known markers</text><text x="594" y="314" font-size="18" fill="#0f172a">Wire, disk and collector checked again</text><text x="594" y="373" font-size="16" fill="#065f46">Missing or foreign IDs fail the check</text>
<rect x="48" y="482" width="984" height="72" rx="14" fill="#e0e7ff" stroke="#6366f1"/><text x="75" y="510" font-size="18" font-weight="700" fill="#312e81">Pass only when identities and independent outcomes agree</text><text x="75" y="536" font-size="16" fill="#3730a3">Bounded to these exact owned paths, commands, canary values and collector URL.</text></g>
</svg>
