<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Lesson 55 simulated canary walkthrough</title>
  <desc id="desc">Select a fixed candidate, inspect gates, start a simulated canary, promote, and roll back. Failed candidates stop at checked.</desc>
  <rect width="960" height="430" fill="#fffdf7"/>
  <text x="38" y="47" fill="#292524" font-family="Arial" font-size="28" font-weight="700">Rehearse the release state machine</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="35" y="113" width="170" height="106" rx="15" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="120" y="154" font-size="19" font-weight="700" fill="#312e81">Select candidate</text>
    <text x="120" y="185" font-size="15" fill="#312e81">9 fixed fixtures</text>
    <rect x="275" y="113" width="170" height="106" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="360" y="154" font-size="19" font-weight="700" fill="#1e3a8a">Run gates</text>
    <text x="360" y="185" font-size="15" fill="#1e3a8a">checked</text>
    <rect x="515" y="113" width="170" height="106" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="600" y="154" font-size="19" font-weight="700" fill="#166534">Start canary</text>
    <text x="600" y="185" font-size="15" fill="#166534">eligible only</text>
    <rect x="755" y="113" width="170" height="106" rx="15" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="840" y="154" font-size="19" font-weight="700" fill="#92400e">Promote</text>
    <text x="840" y="185" font-size="15" fill="#92400e">simulated</text>
  </g>
  <g fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"><path d="M205 166 H263"/><path d="M445 166 H503"/><path d="M685 166 H743"/><path d="M840 219 V286 H601"/></g>
  <rect x="495" y="292" width="210" height="76" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="323" text-anchor="middle" fill="#991b1b" font-family="Arial" font-size="19" font-weight="700">Roll back</text>
  <text x="600" y="349" text-anchor="middle" fill="#991b1b" font-family="Arial" font-size="15">from canary or promoted</text>
  <text x="40" y="399" fill="#57534e" font-family="Arial" font-size="16">A failing gate blocks canary. Editing the scenario clears earlier evidence. No package or deployment changes.</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#475569"/></marker></defs>
</svg>
