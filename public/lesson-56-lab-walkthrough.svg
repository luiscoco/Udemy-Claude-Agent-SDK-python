<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
  <title id="title">Lesson 56 sixteen-step team walkthrough</title>
  <desc id="desc">Five deliberate refusals appear before a single acknowledged message, exact task completion and accepted cleanup.</desc>
  <rect width="960" height="450" fill="#fffdf7"/>
  <text x="38" y="47" font-family="Arial" font-size="28" font-weight="700" fill="#292524">Replay the sixteen-command workshop</text>
  <g font-family="Arial">
    <rect x="43" y="94" width="266" height="116" rx="13" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="62" y="126" font-size="19" font-weight="700" fill="#991b1b">1–4 · Refuse unsafe order</text>
    <text x="62" y="160" font-size="16" fill="#991b1b">Dependency, competing claim,</text>
    <text x="62" y="184" font-size="16" fill="#991b1b">busy shutdown</text>
    <rect x="348" y="94" width="266" height="116" rx="13" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="367" y="126" font-size="19" font-weight="700" fill="#92400e">5–9 · One envelope</text>
    <text x="367" y="160" font-size="16" fill="#92400e">Duplicate retained; early ack</text>
    <text x="367" y="184" font-size="16" fill="#92400e">refused; deliver then ack</text>
    <rect x="653" y="94" width="266" height="116" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="672" y="126" font-size="19" font-weight="700" fill="#1e3a8a">10–13 · Verify tasks</text>
    <text x="672" y="160" font-size="16" fill="#1e3a8a">Wrong 30 refused; exact 37</text>
    <text x="672" y="184" font-size="16" fill="#1e3a8a">and verified: 37 accepted</text>
    <path d="M309 151 H341 M614 151 H646" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M786 210 V263 H479" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="323" y="271" width="314" height="107" rx="13" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="343" y="307" font-size="19" font-weight="700" fill="#166534">14–16 · Close correctly</text>
    <text x="343" y="338" font-size="16" fill="#166534">Both idle members shut down;</text>
    <text x="343" y="362" font-size="16" fill="#166534">lead accepts cleanup</text>
    <text x="40" y="421" font-size="16" fill="#57534e">Step through, replay all, or issue a custom command. Each replay computes a fresh isolated state.</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#475569"/></marker></defs>
</svg>
