<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Lesson 57 lab walkthrough</title><desc id="desc">Two workers start, validate and commit. Independent commits pick serially and clean up. A conflict aborts the current pick and retains three worktrees.</desc>
<rect width="960" height="520" rx="26" fill="#f8fafc"/><text x="42" y="63" fill="#0f172a" font-family="Arial" font-size="29" font-weight="700">From worker evidence to integration</text>
<rect x="55" y="104" width="245" height="96" rx="16" fill="#dbeafe"/><text x="177" y="143" text-anchor="middle" fill="#1e3a8a" font-family="Arial" font-size="20" font-weight="700">Start both workers</text><text x="177" y="172" text-anchor="middle" fill="#1e3a8a" font-family="Arial" font-size="16">same base SHA</text>
<path d="M300 152 H355" stroke="#64748b" stroke-width="5"/>
<rect x="355" y="104" width="245" height="96" rx="16" fill="#e0e7ff"/><text x="477" y="143" text-anchor="middle" fill="#312e81" font-family="Arial" font-size="20" font-weight="700">Validate and commit</text><text x="477" y="172" text-anchor="middle" fill="#312e81" font-family="Arial" font-size="16">exact bytes + Node tests</text>
<path d="M600 152 H655" stroke="#64748b" stroke-width="5"/>
<rect x="655" y="104" width="245" height="96" rx="16" fill="#fef3c7"/><text x="777" y="143" text-anchor="middle" fill="#78350f" font-family="Arial" font-size="20" font-weight="700">Pick serially</text><text x="777" y="172" text-anchor="middle" fill="#78350f" font-family="Arial" font-size="16">original to integrated SHA</text>
<path d="M777 200 V258 M777 258 H270 M777 258 H700" stroke="#64748b" stroke-width="5" fill="none"/>
<rect x="70" y="288" width="390" height="167" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="265" y="330" text-anchor="middle" fill="#14532d" font-family="Arial" font-size="23" font-weight="700">Independent: passed</text><text x="265" y="368" text-anchor="middle" fill="#14532d" font-family="Arial" font-size="17">both combined tests pass</text><text x="265" y="398" text-anchor="middle" fill="#14532d" font-family="Arial" font-size="17">clean nonforce removal</text><text x="265" y="428" text-anchor="middle" fill="#14532d" font-family="Arial" font-size="17">one main worktree remains</text>
<rect x="500" y="288" width="390" height="167" rx="20" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="695" y="330" text-anchor="middle" fill="#9a3412" font-family="Arial" font-size="23" font-weight="700">Conflict: needs review</text><text x="695" y="368" text-anchor="middle" fill="#9a3412" font-family="Arial" font-size="17">unmerged greeting.mjs recorded</text><text x="695" y="398" text-anchor="middle" fill="#9a3412" font-family="Arial" font-size="17">current pick aborted</text><text x="695" y="428" text-anchor="middle" fill="#9a3412" font-family="Arial" font-size="17">both worker checkouts retained</text>
</svg>
