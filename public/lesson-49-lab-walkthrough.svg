<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="590" viewBox="0 0 1080 590" role="img" aria-labelledby="title desc">
<title id="title">Lesson 49 lab walkthrough</title><desc id="desc">Four actions: native or local headless, clean and buggy CI, process limits and a one-slot local worker drain.</desc>
<rect width="1080" height="590" fill="#f8fafc"/><text x="48" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Four bounded actions</text>
<g font-family="Arial,sans-serif" fill="#0f172a" stroke-width="2"><rect x="48" y="105" width="470" height="180" rx="18" fill="#e0f2fe" stroke="#0284c7"/><text x="75" y="148" font-size="23">1 · Headless</text><text x="75" y="188" font-size="17">CLI actual close + SDK mapped code</text><text x="75" y="222" font-size="17">Both require exact clean PASS report</text><rect x="562" y="105" width="470" height="180" rx="18" fill="#dcfce7" stroke="#16a34a"/><text x="589" y="148" font-size="23">2 · CI</text><text x="589" y="188" font-size="17">Clean PASS / 0, buggy FAIL / 20</text><text x="589" y="222" font-size="17">Source is read and hashed, never run</text><rect x="48" y="320" width="470" height="180" rx="18" fill="#fef3c7" stroke="#d97706"/><text x="75" y="363" font-size="23">3 · Limits</text><text x="75" y="403" font-size="17">Six real child processes</text><text x="75" y="437" font-size="17">0 · 11 · 11 · 12 · 124 · 127</text><rect x="562" y="320" width="470" height="180" rx="18" fill="#ede9fe" stroke="#7c3aed"/><text x="589" y="363" font-size="23">4 · Local worker</text><text x="589" y="403" font-size="17">One job 200 · second job 429</text><text x="589" y="437" font-size="17">Drain ready 503 · release · TCP close</text></g><text x="48" y="548" font-family="Arial,sans-serif" font-size="16" fill="#475569">Paid calls occur only in Headless and CI live modes. Limits and worker actions stay local.</text></svg>
