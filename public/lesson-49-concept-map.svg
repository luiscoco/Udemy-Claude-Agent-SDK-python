<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">Lesson 49 headless evidence map</title><desc id="desc">A fixed source, child process, machine terminal and host CI policy join by run identity.</desc>
<rect width="1080" height="560" fill="#f8fafc"/><text x="48" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Headless CI: independent evidence</text>
<g font-family="Arial,sans-serif" fill="#0f172a" stroke-width="2"><rect x="48" y="116" width="260" height="126" rx="18" fill="#dbeafe" stroke="#2563eb"/><text x="72" y="153" font-size="20">Fixed source</text><text x="72" y="187" font-size="16">clean or buggy pricing</text><text x="72" y="213" font-size="16">hash before and after</text><rect x="410" y="116" width="260" height="126" rx="18" fill="#fef3c7" stroke="#d97706"/><text x="434" y="153" font-size="20">Headless process</text><text x="434" y="187" font-size="16">EOF stdin · separate pipes</text><text x="434" y="213" font-size="16">actual close or timeout</text><rect x="772" y="116" width="260" height="126" rx="18" fill="#dcfce7" stroke="#16a34a"/><text x="796" y="153" font-size="20">Machine report</text><text x="796" y="187" font-size="16">exact run ID and schema</text><text x="796" y="213" font-size="16">PASS/[] or FAIL/issues</text><rect x="246" y="338" width="260" height="125" rx="18" fill="#ede9fe" stroke="#7c3aed"/><text x="270" y="375" font-size="20">Host policy code</text><text x="270" y="408" font-size="16">0 · 10 · 11 · 12</text><text x="270" y="434" font-size="16">124 · 127 · 130</text><rect x="574" y="338" width="260" height="125" rx="18" fill="#fee2e2" stroke="#dc2626"/><text x="598" y="375" font-size="20">CI decision</text><text x="598" y="408" font-size="16">clean PASS → 0</text><text x="598" y="434" font-size="16">buggy FAIL → 20</text></g><g stroke="#475569" stroke-width="3" fill="none"><path d="M308 178H400"/><path d="M670 178H762"/><path d="M540 242V300H376V328"/><path d="M900 242V300H704V328"/><path d="M506 400H564"/></g><text x="48" y="517" font-family="Arial,sans-serif" font-size="16" fill="#475569">The local worker and configuration files demonstrate deployment mechanics; they do not publish a service.</text></svg>
