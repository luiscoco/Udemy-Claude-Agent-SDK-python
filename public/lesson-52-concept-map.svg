<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
<title id="title">Evaluation evidence concept map</title><desc id="desc">Three fixed Ada cases produce isolated trial replies and host effects. Business checks and a calibrated judge flow into a comparison with hard gates, Wilson intervals, Fisher evidence and cost.</desc>
<rect width="960" height="450" rx="24" fill="#f8fafc"/><g font-family="Arial" fill="#172033"><text x="30" y="52" font-size="30" font-weight="bold">From trials to a regression verdict</text>
<rect x="28" y="92" width="260" height="146" rx="16" fill="#ddd6fe"/><text x="48" y="132" font-size="22" font-weight="bold">Fixed Ada cases</text><text x="48" y="170" font-size="20">orders · ticket</text><text x="48" y="202" font-size="20">denied refund</text>
<path d="M290 165h43" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrow)"/><rect x="340" y="92" width="268" height="146" rx="16" fill="#ccfbf1"/><text x="360" y="132" font-size="22" font-weight="bold">Retained trials</text><text x="360" y="170" font-size="20">reply + actual effects</text><text x="360" y="202" font-size="20">source + separate costs</text>
<path d="M610 165h43" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/><rect x="660" y="92" width="270" height="146" rx="16" fill="#dbeafe"/><text x="680" y="132" font-size="22" font-weight="bold">Two checkers</text><text x="680" y="170" font-size="20">business facts</text><text x="680" y="202" font-size="20">five judge criteria</text>
<rect x="28" y="270" width="902" height="134" rx="16" fill="#fef3c7"/><text x="48" y="310" font-size="22" font-weight="bold">Compare compatible baseline and candidate</text><text x="48" y="346" font-size="20">hard scope/money gates · Wilson 95% · Fisher exact · agent cost 1.5×</text><text x="48" y="382" font-size="20">pass / fail / suspect / stale / error</text></g>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#475569"/></marker></defs></svg>
