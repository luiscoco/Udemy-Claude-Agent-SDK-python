<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-label="Lesson 45 cloud provider lab walkthrough">
<rect width="1200" height="690" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#14213d">
<text x="54" y="61" font-size="34" font-weight="700">Five actions, one evidence rule</text>
<text x="54" y="96" font-size="17" fill="#475569">Each action owns its lane, credentials, endpoint and receipt list.</text>
<rect x="55" y="146" width="210" height="342" rx="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="77" y="189" font-size="23" font-weight="700">1 · Catalog</text>
<text x="77" y="234" font-size="17">Five native account</text><text x="77" y="261" font-size="17">identities and models</text>
<text x="77" y="323" font-size="16">No user prompt</text><text x="77" y="348" font-size="16">No forwarded call</text>
<rect x="280" y="146" width="210" height="342" rx="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
<text x="302" y="189" font-size="23" font-weight="700">2 · Same</text>
<text x="302" y="234" font-size="17">One Haiku task in</text><text x="302" y="261" font-size="17">five wire formats</text>
<text x="302" y="323" font-size="16">Model + auth receipt</text><text x="302" y="348" font-size="16">for each provider</text>
<rect x="505" y="146" width="210" height="342" rx="20" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
<text x="527" y="189" font-size="23" font-weight="700">3 · Auth</text>
<text x="527" y="234" font-size="17">Missing and wrong</text><text x="527" y="261" font-size="17">credentials get 401</text>
<text x="527" y="323" font-size="16">Then one valid</text><text x="527" y="348" font-size="16">native request</text>
<rect x="730" y="146" width="210" height="342" rx="20" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
<text x="752" y="189" font-size="23" font-weight="700">4 · Models</text>
<text x="752" y="234" font-size="17">Alias, owned ARN</text><text x="752" y="261" font-size="17">or region prefix</text>
<text x="752" y="323" font-size="16">Check actual wire ID</text><text x="752" y="348" font-size="16">and canonical Haiku</text>
<rect x="955" y="146" width="190" height="342" rx="20" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
<text x="977" y="189" font-size="23" font-weight="700">5 · Failure</text>
<text x="977" y="234" font-size="17">Sonnet gets 403</text><text x="977" y="261" font-size="17">with zero upstream</text>
<text x="977" y="323" font-size="16">Fresh Haiku query</text><text x="977" y="348" font-size="16">recovers explicitly</text>
<path d="M268 306H277M493 306H502M718 306H727M943 306H952" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="55" y="543" width="1090" height="89" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="79" y="578" font-size="21" font-weight="700">Automatic check</text>
<text x="79" y="608" font-size="17">Match run + lane + auth + wire model + upstream message ID + SDK session/result.</text>
</g><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
</svg>
