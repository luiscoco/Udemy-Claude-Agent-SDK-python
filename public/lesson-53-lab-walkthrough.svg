<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Lesson 53 lab walkthrough</title>
  <desc id="desc">Select a fixed fault, replay and inspect the first finding, reload the saved bundle, then change one setting and compare retained runs.</desc>
  <rect width="960" height="440" rx="26" fill="#faf7f2"/><text x="44" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#402c1e">Replay, inspect, compare</text>
  <g font-family="Arial,sans-serif"><rect x="42" y="96" width="420" height="125" rx="18" fill="#fff1d9" stroke="#d39d47" stroke-width="3"/><circle cx="80" cy="132" r="23" fill="#b77422"/><text x="80" y="140" font-size="22" text-anchor="middle" fill="#fff">1</text><text x="118" y="134" font-size="21" font-weight="700" fill="#402c1e">Choose a fixed fault</text><text x="118" y="170" font-size="16" fill="#6a4c30">Prepared replay · zero model calls</text><text x="118" y="194" font-size="16" fill="#6a4c30">or explicit paid native run</text>
  <rect x="498" y="96" width="420" height="125" rx="18" fill="#e9edfb" stroke="#7b87be" stroke-width="3"/><circle cx="536" cy="132" r="23" fill="#5f6da9"/><text x="536" y="140" font-size="22" text-anchor="middle" fill="#fff">2</text><text x="574" y="134" font-size="21" font-weight="700" fill="#2c345b">Inspect first finding</text><text x="574" y="170" font-size="16" fill="#4a5482">Follow row and Read call ID</text><text x="574" y="194" font-size="16" fill="#4a5482">through downstream symptoms</text>
  <rect x="42" y="250" width="420" height="125" rx="18" fill="#def3ed" stroke="#4f9d83" stroke-width="3"/><circle cx="80" cy="286" r="23" fill="#327e65"/><text x="80" y="294" font-size="22" text-anchor="middle" fill="#fff">3</text><text x="118" y="288" font-size="21" font-weight="700" fill="#194b3b">Reload saved evidence</text><text x="118" y="324" font-size="16" fill="#386a58">Check UUID, digest, closure</text><text x="118" y="348" font-size="16" fill="#386a58">and redacted bounded log</text>
  <rect x="498" y="250" width="420" height="125" rx="18" fill="#f7e6e5" stroke="#bb7874" stroke-width="3"/><circle cx="536" cy="286" r="23" fill="#a75c58"/><text x="536" y="294" font-size="22" text-anchor="middle" fill="#fff">4</text><text x="574" y="288" font-size="21" font-weight="700" fill="#663734">Change one variable</text><text x="574" y="324" font-size="16" fill="#8b514d">Compare retained first findings</text><text x="574" y="348" font-size="16" fill="#8b514d">without claiming causal proof</text></g>
</svg>
