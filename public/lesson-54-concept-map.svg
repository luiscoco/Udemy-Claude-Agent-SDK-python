<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 530" role="img" aria-labelledby="title desc">
<title id="title">Tool contract concept map</title><desc id="desc">A single immutable catalog feeds vague lookup and focused search and get tools. Focused results carry stable IDs, cursors, errors and measured bytes into an evidence gate.</desc>
<rect width="1100" height="530" fill="#f8fafc"/><text x="46" y="60" font-family="Arial" font-size="29" font-weight="bold" fill="#0f172a">One catalog · two tool contracts</text>
<rect x="40" y="175" width="210" height="140" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="68" y="215" font-family="Arial" font-size="19" font-weight="bold" fill="#075985">Immutable fixture</text><text x="68" y="247" font-family="Arial" font-size="15" fill="#075985">5 synthetic products</text><text x="68" y="275" font-family="Arial" font-size="15" fill="#075985">raw SHA-256 snapshot</text>
<path d="M250 245H335M335 245V145H375M335 245V355H375" fill="none" stroke="#475569" stroke-width="4"/>
<rect x="375" y="95" width="285" height="130" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="402" y="139" font-family="Arial" font-size="20" font-weight="bold" fill="#92400e">Vague lookup(q)</text><text x="402" y="169" font-family="Arial" font-size="15" fill="#92400e">Broad verbose products</text><text x="402" y="193" font-family="Arial" font-size="15" fill="#92400e">No focused lesson credit</text>
<rect x="375" y="285" width="285" height="150" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="402" y="326" font-family="Arial" font-size="20" font-weight="bold" fill="#166534">Focused search → get</text><text x="402" y="355" font-family="Arial" font-size="15" fill="#166534">Cents · stock · stable IDs</text><text x="402" y="380" font-family="Arial" font-size="15" fill="#166534">Bounded pages + nextCursor</text><text x="402" y="405" font-family="Arial" font-size="15" fill="#166534">Actionable errors</text>
<path d="M660 160H740M660 355H740" fill="none" stroke="#475569" stroke-width="4"/>
<rect x="740" y="135" width="310" height="265" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="769" y="181" font-family="Arial" font-size="20" font-weight="bold" fill="#5b21b6">Evidence gate</text><text x="769" y="216" font-family="Arial" font-size="16" fill="#5b21b6">Exact tool-use / result ID</text><text x="769" y="245" font-family="Arial" font-size="16" fill="#5b21b6">Handler receipt + real bytes</text><text x="769" y="274" font-family="Arial" font-size="16" fill="#5b21b6">Complete cursor chain</text><text x="769" y="303" font-family="Arial" font-size="16" fill="#5b21b6">Fixture hash unchanged</text><text x="769" y="332" font-family="Arial" font-size="16" fill="#5b21b6">Closed run + terminal</text><text x="769" y="369" font-family="Arial" font-size="15" fill="#6d28d9">Only focused path can pass</text>
<text x="46" y="495" font-family="Arial" font-size="16" fill="#334155">Prepared consumer is scripted; native evidence measures one model run. Envelope bytes are not token or network cost.</text>
</svg>
