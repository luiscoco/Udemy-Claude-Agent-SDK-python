<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">SDK compatibility gate concept map</title>
  <desc id="desc">Actual installed Python SDK inventory and four synthetic independent gates determine simulated candidate eligibility.</desc>
  <rect width="960" height="460" fill="#f8fafc"/>
  <text x="40" y="46" fill="#0f172a" font-family="Arial" font-size="28" font-weight="700">Upgrade decisions need application evidence</text>
  <rect x="40" y="90" width="260" height="116" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="126" fill="#1e3a8a" font-family="Arial" font-size="20" font-weight="700">Observed inventory</text>
  <text x="60" y="156" fill="#1e3a8a" font-family="Arial" font-size="16">Exact pin · lock · installed</text>
  <text x="60" y="182" fill="#1e3a8a" font-family="Arial" font-size="16">Public Python exports</text>
  <path d="M300 148 H345" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="350" y="82" width="330" height="270" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="374" y="119" fill="#065f46" font-family="Arial" font-size="20" font-weight="700">Four independent fixture gates</text>
  <text x="374" y="158" fill="#065f46" font-family="Arial" font-size="18">1  Required exports</text>
  <text x="374" y="203" fill="#065f46" font-family="Arial" font-size="18">2  Correlated stream events</text>
  <text x="374" y="248" fill="#065f46" font-family="Arial" font-size="18">3  Denied outside Write</text>
  <text x="374" y="293" fill="#065f46" font-family="Arial" font-size="18">4  Quality, cost and latency</text>
  <path d="M680 216 H725" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="730" y="139" width="190" height="155" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="752" y="181" fill="#92400e" font-family="Arial" font-size="20" font-weight="700">Decision</text>
  <text x="752" y="216" fill="#92400e" font-family="Arial" font-size="16">All pass → eligible</text>
  <text x="752" y="247" fill="#92400e" font-family="Arial" font-size="16">Any fail → blocked</text>
  <text x="40" y="405" fill="#475569" font-family="Arial" font-size="17">Synthetic candidate records teach gate logic. Real upgrade validation remains a separate procedure.</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#334155"/></marker></defs>
</svg>
