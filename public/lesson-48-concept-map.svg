<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">Lesson 48 security boundaries</title><desc id="desc">Synthetic fixtures, child environment, host tool admission, output rewrite and independent observations.</desc>
<rect width="1080" height="560" fill="#f8fafc"/><text x="48" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Security hardening: fixed owned probes</text>
<g font-family="Arial,sans-serif" font-size="18" fill="#0f172a" stroke-width="2">
<rect x="48" y="112" width="260" height="120" rx="18" fill="#e0f2fe" stroke="#0284c7"/><text x="72" y="150">Synthetic fixtures</text><text x="72" y="180" font-size="15">.env · outside file · ticket</text><text x="72" y="205" font-size="15">known marker values</text>
<rect x="410" y="112" width="260" height="120" rx="18" fill="#fef3c7" stroke="#d97706"/><text x="434" y="150">Small child environment</text><text x="434" y="180" font-size="15">owned home + fake key</text><text x="434" y="205" font-size="15">guarded omits app value</text>
<rect x="772" y="112" width="260" height="120" rx="18" fill="#ede9fe" stroke="#7c3aed"/><text x="796" y="150">Native SDK tools</text><text x="796" y="180" font-size="15">Read · Write · Bash</text><text x="796" y="205" font-size="15">fixed path or literal argv</text>
<rect x="48" y="324" width="260" height="132" rx="18" fill="#fee2e2" stroke="#dc2626"/><text x="72" y="362">Host admission</text><text x="72" y="392" font-size="15">deny protected read/write</text><text x="72" y="418" font-size="15">and owned egress target</text>
<rect x="410" y="324" width="260" height="132" rx="18" fill="#dcfce7" stroke="#16a34a"/><text x="434" y="362">Known output rewrite</text><text x="434" y="392" font-size="15">replace exact markers</text><text x="434" y="418" font-size="15">before model context</text>
<rect x="772" y="324" width="260" height="132" rx="18" fill="#e0e7ff" stroke="#4f46e5"/><text x="796" y="362">Independent checks</text><text x="796" y="392" font-size="15">model wire · outside bytes</text><text x="796" y="418" font-size="15">collector · closure</text>
</g><g stroke="#475569" stroke-width="3" fill="none"><path d="M308 172H400"/><path d="M670 172H762"/><path d="M902 232V314"/><path d="M772 390H680"/><path d="M410 390H318"/></g><g fill="#475569"><path d="m400 172-12-7v14z"/><path d="m762 172-12-7v14z"/><path d="m902 314-7-12h14z"/><path d="m680 390 12-7v14z"/><path d="m318 390 12-7v14z"/></g><text x="48" y="510" font-family="Arial,sans-serif" font-size="16" fill="#475569">Untrusted ticket text is data. Every later tool call still passes the same host policy.</text>
</svg>
