<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc">
<title id="title">Catalog lab walkthrough</title><desc id="desc">Four steps: direct valid and invalid calls, prepared vague lookup, prepared focused cursor loop with detail calls, and optional guarded live comparison with Stop.</desc>
<rect width="1100" height="510" fill="#fffdf7"/><text x="45" y="58" font-family="Arial" font-size="29" font-weight="bold" fill="#292524">Test the contract before trusting a model</text>
<g font-family="Arial"><rect x="40" y="130" width="230" height="260" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><circle cx="75" cy="168" r="20" fill="#dc2626"/><text x="68" y="175" font-size="19" fill="white">1</text><text x="105" y="178" font-size="19" font-weight="bold" fill="#7f1d1d">Direct call</text><text x="62" y="222" font-size="15" fill="#7f1d1d">Valid SKU or search</text><text x="62" y="252" font-size="15" fill="#7f1d1d">Invalid input → recovery</text><text x="62" y="282" font-size="15" fill="#7f1d1d">No model or lesson credit</text>
<rect x="300" y="130" width="230" height="260" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><circle cx="335" cy="168" r="20" fill="#d97706"/><text x="328" y="175" font-size="19" fill="white">2</text><text x="365" y="178" font-size="19" font-weight="bold" fill="#92400e">Vague replay</text><text x="322" y="222" font-size="15" fill="#92400e">lookup("camping")</text><text x="322" y="252" font-size="15" fill="#92400e">Broad verbose response</text><text x="322" y="282" font-size="15" fill="#92400e">Observation only</text>
<rect x="560" y="130" width="230" height="260" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><circle cx="595" cy="168" r="20" fill="#16a34a"/><text x="588" y="175" font-size="19" fill="white">3</text><text x="625" y="178" font-size="19" font-weight="bold" fill="#166534">Focused replay</text><text x="582" y="222" font-size="15" fill="#166534">Search → nextCursor</text><text x="582" y="252" font-size="15" fill="#166534">Get each returned SKU</text><text x="582" y="282" font-size="15" fill="#166534">Check IDs + receipt bytes</text>
<rect x="820" y="130" width="230" height="260" rx="18" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/><circle cx="855" cy="168" r="20" fill="#4f46e5"/><text x="848" y="175" font-size="19" fill="white">4</text><text x="885" y="178" font-size="19" font-weight="bold" fill="#312e81">Live compare</text><text x="842" y="222" font-size="15" fill="#312e81">Fresh paid consent</text><text x="842" y="252" font-size="15" fill="#312e81">One capped call/profile</text><text x="842" y="282" font-size="15" fill="#312e81">Stop preserves partial trace</text></g>
<path d="M270 260h30m230 0h30m230 0h30" stroke="#57534e" stroke-width="5"/>
<text x="44" y="450" font-family="Arial" font-size="17" fill="#44403c">Change inputs → clear prior check and consent. Read the current call IDs, fixture hashes, errors and actual envelope bytes.</text>
</svg>
