<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Lesson 47 orchestration lab walkthrough</title>
  <desc id="desc">Five sequential evidence checks from owned CSV truth through worker start, actual work, completion, host report check, and dependent handoff or skip.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#64748b" stroke-width="2"/></marker></defs>
  <rect width="960" height="560" rx="24" fill="#f8fafc"/>
  <text x="48" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Trace one worker before trusting the merge</text>
  <text x="48" y="91" font-family="Arial,sans-serif" font-size="17" fill="#475569">Example: north.csv → analyst report → dependent work</text>
  <rect x="45" y="143" width="165" height="152" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="65" y="180" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1e40af">1 · Owned file</text><text x="65" y="216" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">north.csv</text><text x="65" y="251" font-family="Arial,sans-serif" font-size="15" fill="#475569">55 units · P2</text>
  <path d="M213 220 H237" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
  <rect x="244" y="143" width="165" height="152" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="264" y="180" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#075985">2 · Start ID</text><text x="264" y="216" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">role + parent</text><text x="264" y="251" font-family="Arial,sans-serif" font-size="15" fill="#475569">owner + depth</text>
  <path d="M412 220 H436" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
  <rect x="443" y="143" width="165" height="152" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="463" y="180" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#6d28d9">3 · Actual work</text><text x="463" y="216" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">Read + hash</text><text x="463" y="251" font-family="Arial,sans-serif" font-size="15" fill="#475569">same worker ID</text>
  <path d="M611 220 H635" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
  <rect x="642" y="143" width="273" height="152" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="662" y="180" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#166534">4 · End + host verdict</text><text x="662" y="216" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">REGION=north; TOTAL=55;</text><text x="662" y="245" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">BEST=P2</text><text x="662" y="272" font-family="Arial,sans-serif" font-size="14" fill="#475569">compare with fixture truth</text>
  <path d="M778 299 V344" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
  <rect x="480" y="354" width="435" height="142" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="500" y="390" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#92400e">5 · Handoff or dependent skip</text><text x="500" y="427" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">Passing report → digest-bound next worker</text><text x="500" y="458" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">Stopped or failed worker → no merge</text>
  <rect x="45" y="354" width="388" height="142" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="65" y="390" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#991b1b">Challenge · stop north</text><text x="65" y="427" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">South and east may still finish.</text><text x="65" y="458" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">The required merge is skipped.</text>
</svg>
