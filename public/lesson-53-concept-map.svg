<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Lesson 53 diagnostic evidence concept map</title>
  <desc id="desc">Owned fixture and SDK events join by run and call IDs, flow through bounded redaction and causal diagnosis, then a persisted bundle and digest.</desc>
  <rect width="960" height="440" rx="26" fill="#f4f8fc"/>
  <text x="44" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#12304a">Find the first useful evidence</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="42" y="100" width="230" height="128" rx="16" fill="#dceefa" stroke="#3381a8" stroke-width="3"/><text x="157" y="142" font-size="20" font-weight="700" fill="#12304a">Owned run UUID</text><text x="157" y="177" font-size="15" fill="#244d64">fixture hash · policy</text><text x="157" y="202" font-size="15" fill="#244d64">fresh SDK session</text>
  <rect x="365" y="100" width="230" height="128" rx="16" fill="#e6e0fb" stroke="#7863b2" stroke-width="3"/><text x="480" y="142" font-size="20" font-weight="700" fill="#302657">Correlated trace</text><text x="480" y="177" font-size="15" fill="#4c3b77">Read call ID → result</text><text x="480" y="202" font-size="15" fill="#4c3b77">terminal → exception</text>
  <rect x="688" y="100" width="230" height="128" rx="16" fill="#dff4e8" stroke="#46936e" stroke-width="3"/><text x="803" y="142" font-size="20" font-weight="700" fill="#174b35">Causal finding</text><text x="803" y="177" font-size="15" fill="#286347">earliest supporting row</text><text x="803" y="202" font-size="15" fill="#286347">concrete next check</text></g>
  <path d="M274 164h82m241 0h82" stroke="#567286" stroke-width="5" fill="none" marker-end="url(#arrow)"/><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1l9 5-9 5" fill="#567286"/></marker></defs>
  <rect x="134" y="292" width="692" height="95" rx="16" fill="#fff" stroke="#afc3d1" stroke-width="2"/><text x="480" y="325" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#12304a">Bounded redaction → saved bundle → independent reload and SHA-256</text><text x="480" y="356" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#496473">Prepared SDK rows are authored; native rows are measured. Review redaction before sharing.</text>
</svg>
