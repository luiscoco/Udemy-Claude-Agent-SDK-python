<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Lesson 50 walkthrough from orders through ticket, denied and approved refund, CRM close and local evaluations">
<rect width="1200" height="620" fill="#f7f9fc"/><text x="45" y="62" font-family="Arial" font-size="34" font-weight="bold" fill="#15243d">Run the support desk lifecycle</text>
<text x="45" y="99" font-family="Arial" font-size="18" fill="#43546e">Each operation starts with a fresh orders read; resume the same open conversation.</text>
<g font-family="Arial" fill="#14233d"><rect x="45" y="145" width="335" height="135" rx="16" fill="#e1e9ff"/><text x="67" y="184" font-size="22" font-weight="bold">1 · Orders</text><text x="67" y="218" font-size="18">Choose Ada; inspect her order.</text><text x="67" y="250" font-size="15">Save the conversation UUID.</text>
<rect x="430" y="145" width="335" height="135" rx="16" fill="#ddf3ea"/><text x="452" y="184" font-size="22" font-weight="bold">2 · Ticket</text><text x="452" y="218" font-size="18">Resume; read, then create.</text><text x="452" y="250" font-size="15">Match ticket call and audit IDs.</text>
<rect x="815" y="145" width="335" height="135" rx="16" fill="#fff0d5"/><text x="837" y="184" font-size="22" font-weight="bold">3 · Deny refund</text><text x="837" y="218" font-size="18">Resume; choose Deny.</text><text x="837" y="250" font-size="15">Audit denial; zero refund effect.</text>
<rect x="45" y="365" width="335" height="135" rx="16" fill="#fce4e9"/><text x="67" y="404" font-size="22" font-weight="bold">4 · Approve refund</text><text x="67" y="438" font-size="18">Resume; approve exact call.</text><text x="67" y="470" font-size="15">One 1000-cent persisted row.</text>
<rect x="430" y="365" width="335" height="135" rx="16" fill="#e7e5ff"/><text x="452" y="404" font-size="22" font-weight="bold">5 · CRM close</text><text x="452" y="438" font-size="18">Run the restricted fork.</text><text x="452" y="470" font-size="15">Structured CRM; transcript stable.</text>
<rect x="815" y="365" width="335" height="135" rx="16" fill="#d9eef4"/><text x="837" y="404" font-size="22" font-weight="bold">6 · Evaluate</text><text x="837" y="438" font-size="18">Run local negative cases.</text><text x="837" y="470" font-size="15">Foreign call and deny stay safe.</text>
<path d="M380 212H430M765 212H815M982 280V322H212V365M380 432H430M765 432H815" fill="none" stroke="#687b98" stroke-width="4"/>
<text x="45" y="570" font-size="18">Live: confirm each paid action · Check native call/result pairs and saved host effects · Keep one conversation in scope</text></g></svg>
